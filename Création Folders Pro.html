<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>📁 Création Folders Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body {
    font-family:'Cairo',sans-serif;
    margin:0; padding:0;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color:#fff;
    transition: background 0.5s;
}
.container{
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 30px;
    border-radius: 20px;
    width: 90%;
    max-width: 800px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    text-align:center;
}
h2{ font-size:28px; color:#1f4037; margin-bottom:15px;}
p{ font-size:16px; color:#555; margin-bottom:20px;}
#folderList{ list-style:none; padding:0; max-height:300px; overflow-y:auto; border:2px solid #1f4037; border-radius:12px; margin-top:10px;}
#folderList li{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #ddd; background:#f5f5f5; color:#333; border-radius:6px; margin-bottom:4px;}
#folderList li:last-child{ border-bottom:none; margin-bottom:0;}
input.folderName{ border:none; outline:none; width:50%; font-size:15px; background:transparent; color:#333;}
button,.btn{ padding:6px 12px; border-radius:8px; border:none; cursor:pointer; margin-left:5px; font-size:14px; font-weight:bold;}
button{ background: linear-gradient(90deg,#11998e,#38ef7d); color:white; transition:all 0.3s;}
button:hover{ background: linear-gradient(90deg,#38ef7d,#11998e); transform:translateY(-2px);}
.btn-remove{ background:#d9534f;color:white;}
.btn-remove:hover{ background:#c9302c;}
.btn-files{ background:#ff9800;color:white;}
.btn-files:hover{ background:#e68900;}
.options{ margin-top:15px; text-align:right; font-size:14px; color:#333;}
#status{ margin-top:18px; font-size:16px; min-height:24px; font-weight:bold;}
.theme-toggle{ position:absolute; top:20px; right:20px; background:#fff; color:#333; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:bold;}
</style>
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()">🎨 تبديل الثيم</div>

<div class="container">
<h2>📁 Création Folders Pro</h2>
<p>أضف، عدّل، استورد أسماء المجلدات، واختر ملفات لكل مجلد على حدة.</p>

<input type="text" id="newFolder" placeholder="اكتب اسم المجلد وأضغط إضافة">
<button onclick="addFolder()">➕ إضافة</button>
<input type="file" id="fileInput" accept=".txt,.csv,.xlsx"><br><br>

<ul id="folderList"></ul>

<div class="options">
<label><input type="checkbox" id="numbering"> 🔢 إضافة ترقيم تلقائي</label><br>
<label><input type="checkbox" id="createFile"> 📄 إنشاء ملف نصي داخل كل مجلد</label>
</div>

<button onclick="createFolders()">📂 إنشاء المجلدات</button>
<div id="status"></div>
</div>

<script>
let darkTheme = true;
function toggleTheme(){
    darkTheme = !darkTheme;
    document.body.style.background = darkTheme ? "linear-gradient(135deg, #0f2027, #203a43, #2c5364)" : "linear-gradient(135deg, #f8f9fa, #e0eafc)";
}

const folderList = document.getElementById('folderList');
let folders = []; // لتخزين أسماء المجلدات وملفاتها

document.getElementById('fileInput').addEventListener('change', function(e){
    const reader = new FileReader();
    reader.onload = function(){
        let lines = reader.result.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
        lines.forEach(name => addFolder(name));
    };
    reader.readAsText(e.target.files[0]);
});

function addFolder(name=''){
    const folderName = name || document.getElementById('newFolder').value.trim();
    if(!folderName) return;

    const li = document.createElement('li');
    const idx = folders.length;
    folders.push({name: folderName, files: []});

    li.innerHTML = `<input type="text" class="folderName" value="${folderName}" onchange="updateFolderName(${idx},this.value)">
                    <div>
                    <button class="btn btn-files" onclick="selectFiles(${idx})">📁 اختيار ملفات</button>
                    <button class="btn btn-remove" onclick="removeFolder(${idx},this)">❌</button>
                    </div>`;
    folderList.appendChild(li);
    document.getElementById('newFolder').value='';
}

function updateFolderName(idx, val){
    folders[idx].name = val;
}

function removeFolder(idx, btn){
    folders.splice(idx,1);
    btn.parentElement.parentElement.remove();
}

async function selectFiles(idx){
    // نستخدم input file ديناميكي لاختيار ملفات لكل مجلد
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.onchange = () => { folders[idx].files = Array.from(input.files); };
    input.click();
}

async function createFolders(){
    const status = document.getElementById('status');
    if(folders.length===0){ status.innerHTML="⚠️ لا توجد أسماء مجلدات!"; status.style.color="#d9534f"; return; }

    const numbering = document.getElementById("numbering").checked;
    const createFile = document.getElementById("createFile").checked;

    try{
        const dirHandle = await window.showDirectoryPicker();
        let counter = 1;
        for(const f of folders){
            let name = f.name.trim();
            if(!name) continue;
            let folderName = numbering ? `${counter++} - ${name}` : name;
            const newDir = await dirHandle.getDirectoryHandle(folderName,{create:true});

            if(createFile){
                const fileHandle = await newDir.getFileHandle("info.txt",{create:true});
                const writable = await fileHandle.createWritable();
                await writable.write(`هذا المجلد باسم: ${folderName}`);
                await writable.close();
            }

            for(const file of f.files){
                const fileHandle = await newDir.getFileHandle(file.name,{create:true});
                const writable = await fileHandle.createWritable();
                await writable.write(await file.text());
                await writable.close();
            }
        }
        status.innerHTML="✅ تم إنشاء المجلدات والملفات بنجاح!";
        status.style.color="#11998e";
    } catch(err){
        status.innerHTML="❌ تم الإلغاء أو حدث خطأ";
        status.style.color="#d9534f";
        console.error(err);
    }
}
</script>

</body>
</html>
